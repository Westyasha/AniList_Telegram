[project]
name = "anilist-telegram"
version = "2.0.0"
description = "AniList client for Telegram: bot, notifications, profile cards and a Mini App"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.26.0",
    "aiohttp==3.13.3",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44",
    "jinja2>=3.1",
    "pillow>=11",
    "playwright==1.58.0",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C4", "PIE", "RET"]
ignore = ["E501", "RUF001", "RUF003", "B008", "RET504", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
