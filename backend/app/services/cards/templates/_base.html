<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<style>
{% for weight in [400, 600, 700, 800, 900] %}
@font-face { font-family: "Overpass"; font-weight: {{ weight }}; font-display: block; src: url("{{ asset }}fonts/overpass-latin-{{ weight }}-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Overpass"; font-weight: {{ weight }}; font-display: block; src: url("{{ asset }}fonts/overpass-cyrillic-{{ weight }}-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
{% endfor %}
:root {
  --bg: #08080B;
  --surface: rgba(17, 17, 22, 0.72);
  --line: rgba(255, 255, 255, 0.08);
  --text: #F4F4F6;
  --muted: #A3A3B2;
  --crimson: #E0233D;
  --deep: #8E0C22;
  --accent: {{ accent }};
  --accent2: {{ accent2 }};
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); font-family: "Overpass", "Segoe UI", "DejaVu Sans", sans-serif; -webkit-font-smoothing: antialiased; }
.backdrop { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
.shade { position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(900px 520px at 0% 0%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%),
    radial-gradient(800px 600px at 100% 100%, rgba(224, 35, 61, 0.22), transparent 70%),
    linear-gradient(180deg, rgba(8, 8, 11, 0.35), rgba(8, 8, 11, 0.88)); }
.stars { position: absolute; inset: 0; z-index: 1; opacity: .5;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(1px 1px at 72% 12%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1px 1px at 38% 64%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 88% 58%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 56% 34%, rgba(255,255,255,.5), transparent 60%); }
.logo { display: inline-flex; align-items: flex-end; font-weight: 900; letter-spacing: -2px; line-height: 1; }
.logo .a { color: #fff; }
.logo .l { color: var(--crimson); }
.label { font-size: 15px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.placeholder { background: linear-gradient(135deg, #1F1F28, #121218); }
</style>
{% block style %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
