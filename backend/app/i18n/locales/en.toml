[lang]
name = "English 🇬🇧"

[bot]
short_description = "AniList in Telegram: lists, episode alerts, profile cards and a full Mini App."
description = """Unofficial AniList client for Telegram.

• Search anime, manga, characters and staff
• Manage your list: progress, scores, notes
• Alerts for new episodes and sequels
• Profile card and AniList Wrapped
• A full AniList-style Mini App"""

