1. Tap the button below and sign in to AniList.
2. Confirm the link on the bot's page.
3. Come back to Telegram — everything connects automatically.

<i>The link is valid for 15 minutes and only for your Telegram account.</i>"""
pin_instructions = """<b>Log in with AniList</b>

1. Tap the button below and authorize the app.
2. Copy the code shown on AniList.
3. Send it here — I'll delete the message with the code right away."""
