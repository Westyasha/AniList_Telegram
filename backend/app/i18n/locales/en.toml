[help]
main = """<b>❔ Help</b>

An unofficial AniList client: everything the site does, right inside Telegram.

• Send a title — I'll find the anime
• /login — connect AniList
• /app — open the Mini App
• Bottom menu — quick sections"""
search_button = "🔍 Search"
list_button = "📋 List"
notify_button = "🔔 Notifications"
inline_button = "💬 Inline mode"
app_button = "📱 Mini App"
search = """<b>🔍 Search</b>

• Just send a title to the chat
• /anime, /manga, /character, /staff + query
• /user name — any AniList profile
• 🎯 Filter: genres, year, format, score and sort"""
list = """<b>📋 List</b>

Open a title to manage it: status, +1 episode, score in your AniList format, notes, removal.
Changes sync with AniList instantly."""
notify = """<b>🔔 Notifications</b>

I message you when an episode of a title on your list airs (pick which statuses), when a sequel comes out, and I relay AniList follows, likes and replies.
Configure in ⚙️ Settings → 🔔 Notifications."""
inline = """<b>💬 Inline mode</b>

In any chat:
• <code>@{bot} title</code> — anime card
• <code>@{bot} m title</code> — manga
• <code>@{bot} watching</code> — what you're watching
• <code>@{bot} card</code> — profile card"""
app = """<b>📱 Mini App</b>

A full AniList inside Telegram: home with trending, search with filters, weekly schedule, a library with an entry editor, profile stats and notifications.
Tap “AniList” next to the input field or use /app."""

