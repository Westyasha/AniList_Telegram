<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}AniList × Telegram{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #08080B; color: #F4F4F6;
    font-family: "Overpass", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background-image: radial-gradient(800px 400px at 15% 0%, rgba(224,35,61,.18), transparent 70%), radial-gradient(700px 500px at 100% 100%, rgba(142,12,34,.25), transparent 70%); }
  .card { width: 100%; max-width: 420px; padding: 32px 28px; border-radius: 24px; background: #111116; border: 1px solid rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.5); text-align: center; }
  .logo { font-size: 44px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin-bottom: 18px; }
  .logo .l { color: #E0233D; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  p { color: #A3A3B2; line-height: 1.5; font-size: 15px; }
  .link { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px 0; }
  .who { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 130px; }
  .who img, .who .tg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.1); }
  .who .tg { display: grid; place-items: center; background: #229ED9; font-weight: 900; font-size: 26px; }
  .who b { font-size: 15px; word-break: break-word; }
  .who small { color: #A3A3B2; font-size: 12px; }
  .arrow { color: #E0233D; font-size: 24px; font-weight: 900; }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  button, .button { display: block; width: 100%; padding: 14px 18px; border-radius: 14px; border: 0; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; }
  .primary { background: linear-gradient(135deg, #F0475E, #B0122C); color: #fff; }
  .ghost { background: rgba(255,255,255,.06); color: #F4F4F6; }
  .warn { margin-top: 18px; font-size: 13px; color: #8A8A98; }
  .status { font-size: 52px; margin-bottom: 8px; }
</style>
</head>
<body>
<main class="card">
  <div class="logo"><span>A</span><span class="l">L</span></div>
  {% block body %}{% endblock %}
</main>
</body>
</html>
