{% extends "_layout.html" %}
{% block body %}
{% if ok %}
<div class="status">✅</div>
<h1>{{ _("web.done_title", name=viewer.name) }}</h1>
<p>{{ _("web.done_text") }}</p>
{% else %}
<div class="status">⚠️</div>
<h1>{{ _("web.fail_title") }}</h1>
<p>{{ _("web.fail_" ~ reason) }}</p>
{% endif %}
<div class="actions" style="margin-top: 24px">
  <a class="button primary" href="https://t.me/{{ bot }}">{{ _("web.back_to_telegram") }}</a>
</div>
{% endblock %}
