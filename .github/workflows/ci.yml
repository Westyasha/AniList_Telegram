name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anilist
          POSTGRES_PASSWORD: anilist
          POSTGRES_DB: anilist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anilist"
          --health-interval 5s
          --health-retries 10
    env:
      BOT_TOKEN: "123456:TEST"
      SECRET_KEY: ci-secret
      ANILIST_CLIENT_ID: "1"
      ANILIST_CLIENT_SECRET: ci
      DATABASE_URL: postgresql+asyncpg://anilist:anilist@localhost:5432/anilist
      TEST_DATABASE_URL: postgresql+asyncpg://anilist:anilist@localhost:5432/anilist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests migrations/env.py
      - run: ruff format --check app tests
      - run: alembic upgrade head && alembic check
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
